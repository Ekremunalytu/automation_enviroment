# =============================================================================
# ExTrace Security Scanning
# Runs security checks on code and dependencies
# =============================================================================

name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 9:00 UTC
    - cron: "0 9 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # BANDIT - Python Security Linter
  # ===========================================================================
  bandit:
    name: 🔐 Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Bandit
        run: pip install bandit[toml]

      - name: 🔐 Run Bandit
        run: bandit -c pyproject.toml -r . -f json -o bandit-report.json || true

      - name: 📋 Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: 🔐 Run Bandit (console output)
        run: bandit -c pyproject.toml -r . -ll

  # ===========================================================================
  # TRIVY - Container Security
  # ===========================================================================
  trivy:
    name: 🐳 Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: docker build -t extrace:scan -f docker/api/Dockerfile .
        continue-on-error: true

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "extrace:scan"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
        continue-on-error: true
