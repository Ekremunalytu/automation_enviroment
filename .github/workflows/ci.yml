# =============================================================================
# ExTrace CI Pipeline
# Runs on push and pull requests
# Jobs: lint → type-check → test (parallel)
# =============================================================================

name: CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
    paths:
      - "**.py"
      - "ui/**"
      - "scripts/**"
      - "**.md"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "docker/api/requirements.txt"
      - ".pre-commit-config.yaml"
      - ".markdownlint.json"
      - ".mlc_config.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "**.py"
      - "ui/**"
      - "scripts/**"
      - "**.md"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "docker/api/requirements.txt"
      - ".pre-commit-config.yaml"
      - ".markdownlint.json"
      - ".mlc_config.json"
  workflow_dispatch:  # Manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  # ===========================================================================
  # LINT JOB
  # ===========================================================================
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: 🔍 Run Ruff linter
        run: ruff check . --output-format=github

      - name: 🎨 Check Ruff formatting
        run: ruff format --check .

  # ===========================================================================
  # TYPE CHECK JOB (Parallel with lint)
  # ===========================================================================
  type-check:
    name: 🔬 Type Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/api/requirements.txt
          pip install mypy

      - name: 🔬 Run mypy
        run: mypy . --config-file=pyproject.toml

  # ===========================================================================
  # UI JOB
  # ===========================================================================
  ui:
    name: 🖥️ UI
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install backend schema dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/api/requirements.txt

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: 📦 Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: 🧾 Verify generated UI contracts
        run: make ui-types-check

      - name: 🔍 Run UI lint
        working-directory: ui
        run: npm run lint

      - name: 🧱 Check UI feature boundaries
        working-directory: ui
        run: npm run lint:boundaries

      - name: 🧪 Run UI tests
        working-directory: ui
        run: npm run test

  # ===========================================================================
  # TEST JOB
  # ===========================================================================
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [lint, type-check, ui]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/api/requirements.txt
          pip install -r requirements-dev.txt

      - name: 🏥 Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: 🧪 Run tests with coverage and smoke acceptance
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          make test-ci

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ===========================================================================
  # PRE-COMMIT CHECK (PR's only)
  # ===========================================================================
  pre-commit:
    name: 🪝 Pre-commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🪝 Run pre-commit
        uses: pre-commit/action@v3.0.1

  # ===========================================================================
  # BUILD CHECK - Verify application can start
  # ===========================================================================
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: [lint, type-check, ui]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/api/requirements.txt

      - name: 🔍 Check Python syntax
        run: python -m py_compile main.py

      - name: 📋 Check imports
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          python -c "from main import app; print('✅ Application imports successfully')"
