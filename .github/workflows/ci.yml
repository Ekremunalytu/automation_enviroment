# =============================================================================
# ExTrace CI Pipeline
# Runs on push and pull requests
# Jobs: lint → type-check → test
# =============================================================================

name: CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # LINT JOB
  # ===========================================================================
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: 🔍 Run Ruff linter
        run: ruff check . --output-format=github

      - name: 🎨 Check Ruff formatting
        run: ruff format --check .

  # ===========================================================================
  # TYPE CHECK JOB
  # ===========================================================================
  type-check:
    name: 🔬 Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic pydantic-settings sqlalchemy fastapi types-python-dotenv

      - name: 🔬 Run mypy
        run: mypy . --config-file=pyproject.toml --ignore-missing-imports

  # ===========================================================================
  # TEST JOB
  # ===========================================================================
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: type-check

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r routers/requirements.txt
          pip install -r requirements-dev.txt

      - name: 🧪 Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # PRE-COMMIT CHECK (optional, for PR's)
  # ===========================================================================
  pre-commit:
    name: 🪝 Pre-commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🪝 Run pre-commit
        uses: pre-commit/action@v3.0.1
