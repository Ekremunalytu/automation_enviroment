# Custom Semgrep rules for the static pre-check (ES-4, ADR 0016 §Decision 4).
#
# Four JS/TS dataflow patterns the in-house manifest/identity/file-tree rules
# cannot reach. Each rule's bare `id` is the lookup key for the runner's
# _RULE_META table (static_runtime/semgrep_runner.py): the runner derives the
# contract rule_id / severity / confidence / categories / title from that table,
# NOT from this file, so a malformed rule here can never emit a contract-invalid
# finding. Severity below is advisory only — the runner pins MEDIUM/WARN for all
# four (none is promoted to a gate BLOCK).
#
# Scope: the runner passes `--exclude node_modules --exclude '*.min.js'` and
# `--max-target-bytes`, so vendored/bundled dependencies do not generate noise.
rules:
  - id: eval
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Dynamic code execution via eval(): evaluates a string as code, a common
      vehicle for running attacker-controlled payloads.
    metadata:
      category: security
      references:
        - https://attack.mitre.org/techniques/T1059/
    patterns:
      - pattern: eval(...)

  - id: function_constructor
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Dynamic code execution via the Function constructor: builds a function
      from a string at runtime, equivalent to eval().
    metadata:
      category: security
      references:
        - https://attack.mitre.org/techniques/T1059/
    patterns:
      - pattern-either:
          - pattern: new Function(...)
          - pattern: Function(...)

  - id: child_process
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Use of the child_process module: spawns operating-system processes, a
      direct path to command execution outside the JavaScript sandbox.
    metadata:
      category: security
      references:
        - https://attack.mitre.org/techniques/T1059/
    patterns:
      - pattern-either:
          - pattern: require("child_process")
          - pattern: require('child_process')
          - pattern: require("node:child_process")
          - pattern: require('node:child_process')
          - pattern: child_process.exec(...)
          - pattern: child_process.execSync(...)
          - pattern: child_process.spawn(...)
          - pattern: child_process.spawnSync(...)
          - pattern: child_process.execFile(...)
          - pattern: child_process.fork(...)

  - id: vm_runincontext
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Dynamic code execution via the vm module: runs a string of code in a V8
      context, another eval()-equivalent execution primitive.
    metadata:
      category: security
      references:
        - https://attack.mitre.org/techniques/T1059/
    patterns:
      - pattern-either:
          - pattern: vm.runInContext(...)
          - pattern: vm.runInNewContext(...)
          - pattern: vm.runInThisContext(...)

  - id: outbound_net_module
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Import of a raw network module (http/https/net/tls/dns/dgram): a direct
      outbound socket / request capability that bypasses the editor's vetted
      networking APIs, a common command-and-control / exfiltration primitive.
    metadata:
      category: security
      references:
        - https://attack.mitre.org/techniques/T1071/
    patterns:
      - pattern-either:
          - pattern: require("http")
          - pattern: require('http')
          - pattern: require("node:http")
          - pattern: require('node:http')
          - pattern: require("https")
          - pattern: require('https')
          - pattern: require("node:https")
          - pattern: require('node:https')
          - pattern: require("net")
          - pattern: require('net')
          - pattern: require("node:net")
          - pattern: require('node:net')
          - pattern: require("tls")
          - pattern: require('tls')
          - pattern: require("node:tls")
          - pattern: require('node:tls')
          - pattern: require("dns")
          - pattern: require('dns')
          - pattern: require("node:dns")
          - pattern: require('node:dns')
          - pattern: require("dgram")
          - pattern: require('dgram')
          - pattern: require("node:dgram")
          - pattern: require('node:dgram')

  - id: dynamic_require
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Dynamic require() of a non-literal module specifier: the loaded module is
      computed at runtime, hiding the dependency from static review and enabling
      conditional loading of attacker-staged code.
    metadata:
      category: security
      references:
        - https://attack.mitre.org/techniques/T1027/
    patterns:
      - pattern: require($X)
      - pattern-not: require("...")
      - pattern-not: require('...')

  - id: base64_decode_exec
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Decode-then-execute: a base64 / escaped payload is decoded and run via
      eval() or the Function constructor, a packing trick that smuggles executed
      logic past static review.
    metadata:
      category: security
      references:
        - https://attack.mitre.org/techniques/T1027/
    patterns:
      - pattern-either:
          - pattern: eval(atob(...))
          - pattern: eval(Buffer.from(...))
          - pattern: eval(unescape(...))
          - pattern: eval(decodeURIComponent(...))
          - pattern: Function(atob(...))
          - pattern: new Function(atob(...))
          - pattern: Function(Buffer.from(...))
          - pattern: new Function(Buffer.from(...))

  - id: sensitive_file_read
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Reference to a sensitive credential file path (SSH keys, cloud creds,
      npmrc, docker config): a common target for credential theft.
    metadata:
      category: security
      references:
        - https://attack.mitre.org/techniques/T1552/
    patterns:
      - pattern-regex: (\.ssh/|id_rsa|\.aws/credentials|\.npmrc|\.docker/config\.json)
