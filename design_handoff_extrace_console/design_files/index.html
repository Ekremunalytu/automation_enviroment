<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExTrace — Analyst Console</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Shift5-inspired palette */
    --coral:      #ff5c42;   /* signature red-orange */
    --coral-deep: #e84a31;
    --coral-soft: #ffe4dd;
    --bone:       #d6d4d0;   /* warm light grey */
    --bone-2:     #c5c2bd;
    --paper:      #ededeb;   /* off-white canvas */
    --ink:        #0a0a0a;   /* near-black */
    --ink-2:      #1a1a1a;
    --ink-3:      #4a4a4a;
    --ink-4:      #8a8a8a;
    --rule:       #2b2b2b;   /* hairline on dark */
    --rule-light: #b8b6b1;
    --accent:     #ff5c42;
    --accent-ink: #ffffff;
    --accent-bg:  #ffe4dd;
    --danger:     #ff5c42;
    --danger-bg:  #ffe4dd;
    --warn:       #d4a85a;
    --warn-bg:    #f4e8cd;
    --ok:         #5a8c66;
    --ok-bg:      #d8e4d9;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    background: var(--ink);
    font-family: 'Manrope', sans-serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  #root { position: relative; z-index: 1; }

  button { font-family: inherit; }
  input, textarea { font-family: inherit; }

  ::selection { background: var(--coral); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  /* type utilities */
  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "zero"; }
  .display { font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: -0.045em; line-height: 0.9; }

  /* micro label */
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-4);
  }

  /* page-reveal */
  @keyframes pageReveal { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .page-reveal { animation: pageReveal 280ms ease-out both; }

  /* graph: dashed flow */
  @keyframes flowDash { to { stroke-dashoffset: -24; } }
  .ig-flow { stroke-dasharray: 4 4; animation: flowDash 2.4s linear infinite; }
  .ig-flow-fast { stroke-dasharray: 3 3; animation: flowDash 1.4s linear infinite; }

  /* graph: node pulse */
  @keyframes nodePulse {
    0%,100% { r: 4; opacity: 1; }
    50%     { r: 5.5; opacity: 0.75; }
  }
  @keyframes haloPulse {
    0%   { r: 6;  opacity: 0.6; }
    100% { r: 16; opacity: 0; }
  }
  .ig-node-pulse { animation: nodePulse 2.2s ease-in-out infinite; transform-origin:center; }
  .ig-halo       { animation: haloPulse 2.2s ease-out infinite; transform-origin:center; }

  /* radar */
  @keyframes radarSweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .radar-sweep { animation: radarSweep 8s linear infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes radarBreath { 0%,100% { opacity:0.55; } 50% { opacity:0.85; } }
  .radar-poly { animation: radarBreath 4s ease-in-out infinite; }

  /* timeline pulse */
  @keyframes tlPulse { 0% { r: 4.5; opacity: 0.9; } 100% { r: 16; opacity: 0; } }
  .tl-pulse { animation: tlPulse 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }

  @keyframes laneSlide { from { transform: translateX(-8px); opacity:0; } to { transform: translateX(0); opacity:1; } }
  .tl-lane { animation: laneSlide 500ms cubic-bezier(.2,.8,.2,1) both; }

  .hline { border-bottom: 1px solid var(--rule-light); }

  /* ASCII binary background tile */
  .ascii-grid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    line-height: 1.4;
    color: rgba(255,255,255,0.18);
    letter-spacing: 0.06em;
    user-select: none;
    pointer-events: none;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--ink); }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--coral); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0a0a0a">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0a0a0a"/>
    <g transform="translate(440 260)" stroke="#ff5c42" stroke-width="32" stroke-linecap="square" fill="none">
      <path d="M40 40 L160 160 L40 280"/>
    </g>
    <g transform="translate(620 260)" stroke="#f4f1ea" stroke-width="32" stroke-linecap="square" fill="none">
      <path d="M40 40 L160 160 L40 280"/>
    </g>
    <text x="600" y="640" text-anchor="middle" fill="#f4f1ea" font-family="sans-serif" font-size="56" font-weight="800" letter-spacing="-2">EXTRACE</text>
    <text x="600" y="700" text-anchor="middle" fill="#5a5750" font-family="monospace" font-size="20" letter-spacing="6">ANALYST · CONSOLE</text>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="ReportsPage.jsx"></script>
<script type="text/babel" src="SimulationPage.jsx"></script>
<script type="text/babel" src="MarketplacePage.jsx"></script>
<script type="text/babel" src="SettingsPage.jsx"></script>
<script type="text/babel" src="SystemPage.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const stored = (() => { try { return localStorage.getItem('extrace-v3-page'); } catch { return null; } })();
  const [page, setPage] = React.useState(stored || 'reports');

  const navigate = (p) => {
    setPage(p);
    try { localStorage.setItem('extrace-v3-page', p); } catch {}
  };

  const pageEl = React.useMemo(() => {
    if (page === 'marketplace') return <MarketplacePage onAnalyze={() => navigate('simulation')} />;
    if (page === 'simulation')  return <SimulationPage />;
    if (page === 'settings')    return <SettingsPage />;
    if (page === 'system')      return <SystemPage />;
    return <ReportsPage />;
  }, [page]);

  return (
    <AppShell page={page} onNavigate={navigate}>
      <div className="page-reveal" key={page}>{pageEl}</div>
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
