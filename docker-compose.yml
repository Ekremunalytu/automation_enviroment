name: automation_enviroment

services:
  postgres:
    image: postgres:16-alpine
    container_name: automation_db
    restart: unless-stopped
    command: [ "postgres", "-p", "${POSTGRES_DOCKER_PORT:-5432}" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # ADR 0007 — loopback-only by default. To expose on LAN, edit this
      # line to drop the `127.0.0.1:` prefix after applying the runbook.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_DOCKER_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p ${POSTGRES_DOCKER_PORT:-5432}" ]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-5}

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: automation_api
    restart: unless-stopped
    ports:
      # ADR 0007 — loopback-only by default.
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    # ADR 0007 — uvicorn --host inside the container is 0.0.0.0 so the
    # FastAPI app accepts traffic from the Docker bridge; the host-side
    # exposure is gated by the `127.0.0.1:` prefix on the ports mapping
    # above. EXTRACE_ALLOW_LAN affects only the host-mode `make dev`/`make
    # dev-lan` path, not the in-container bind.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}", "--workers", "${API_WORKERS:-1}"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_DOCKER_HOST:-postgres}:${POSTGRES_DOCKER_PORT:-5432}/${POSTGRES_DB}
      API_HOST: ${API_HOST:-127.0.0.1}
      API_PORT: ${API_PORT:-8000}
      API_WORKERS: ${API_WORKERS:-1}
      API_DEBUG: ${API_DEBUG:-false}
      API_HEALTH_STATUS: ${API_HEALTH_STATUS:-OK}
      API_DOCS_URL: ${API_DOCS_URL:-/docs}
      API_REDOC_URL: ${API_REDOC_URL:-/redoc}
      API_OPENAPI_URL: ${API_OPENAPI_URL:-/openapi.json}
      API_GZIP_MINIMUM_SIZE: ${API_GZIP_MINIMUM_SIZE:-2000}
      API_CORS_ALLOW_ORIGINS: ${API_CORS_ALLOW_ORIGINS:-http://localhost:3000}
      API_CORS_ALLOW_METHODS: ${API_CORS_ALLOW_METHODS:-GET,POST,PUT,DELETE,PATCH,OPTIONS}
      API_CORS_ALLOW_HEADERS: ${API_CORS_ALLOW_HEADERS:-Content-Type,Authorization}
      API_CORS_ALLOW_CREDENTIALS: ${API_CORS_ALLOW_CREDENTIALS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./extensions:/app/extensions
      - ./output:/app/output
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock

  executor:
    build:
      context: .
      dockerfile: executor/container/Dockerfile
      args:
        EXECUTOR_NODE_MAJOR: ${EXECUTOR_NODE_MAJOR:-20}
        EXECUTOR_VSCODE_CHANNEL: ${EXECUTOR_VSCODE_CHANNEL:-stable}
        EXECUTOR_VSCODE_VERSION: ${EXECUTOR_VSCODE_VERSION:-1.116.0}
        EXECUTOR_DEFAULT_DISPLAY: ${EXECUTOR_DISPLAY:-:99}
        EXECUTOR_DEFAULT_NOVNC_PORT: ${EXECUTOR_NOVNC_PORT:-6080}
    container_name: automation_executor
    restart: unless-stopped
    ports:
      # ADR 0007 — loopback-only noVNC. CDP port 9222 is intentionally
      # absent from the default ports list; host-side CDP access is opt-in
      # via the `executor-cdp` sidecar service under the `debug` profile
      # (`make up-debug`).
      - "127.0.0.1:${EXECUTOR_NOVNC_PORT:-6080}:${EXECUTOR_NOVNC_PORT:-6080}"
    environment:
      DISPLAY: ${EXECUTOR_DISPLAY:-:99}
      EXECUTOR_DISPLAY: ${EXECUTOR_DISPLAY:-:99}
      EXECUTOR_SCREEN: ${EXECUTOR_SCREEN:-1920x1080x24}
      EXECUTOR_VNC_HOST: ${EXECUTOR_VNC_HOST:-localhost}
      EXECUTOR_VNC_PORT: ${EXECUTOR_VNC_PORT:-5900}
      EXECUTOR_NOVNC_PORT: ${EXECUTOR_NOVNC_PORT:-6080}
      # W14-3 (M14b): CDP is opt-in; an unset EXECUTOR_CDP_PORT keeps the
      # executor's in-container VS Code from binding the unauthenticated
      # remote-debugging port. The host-side `executor-cdp` sidecar
      # (debug profile, lines below) ALSO requires this variable to be
      # set in the operator's environment before `make up-debug` /
      # `docker compose --profile debug up` will forward anything.
      EXECUTOR_CDP_PORT: ${EXECUTOR_CDP_PORT:-}
      EXECUTOR_STARTUP_SLEEP_SECONDS: ${EXECUTOR_STARTUP_SLEEP_SECONDS:-1}
      EXECUTOR_VSCODE_LOG_LEVEL: ${EXECUTOR_VSCODE_LOG_LEVEL:-trace}
    volumes:
      - ${EXECUTOR_EXTENSIONS_HOST_PATH:-./extensions}:${EXECUTOR_EXTENSIONS_CONTAINER_PATH:-/extensions-input}:ro
      - ${EXECUTOR_OUTPUT_HOST_PATH:-./output}:${EXECUTOR_OUTPUT_CONTAINER_PATH:-/results}
    cap_add:
      - NET_RAW
      - SYS_PTRACE
    mem_limit: ${EXECUTOR_MEM_LIMIT:-4g}
    cpus: ${EXECUTOR_CPUS:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${EXECUTOR_NOVNC_PORT:-6080}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 10s

  # ADR 0007 — opt-in CDP exposure under the `debug` profile.
  # Default `docker compose up` does not start this sidecar, so port 9222
  # remains absent from the host. Operators that need host-side CDP
  # inspection run `make up-debug` (or `docker compose --profile debug up`).
  # The socat forwarder reaches the executor container by Docker network
  # name so we don't need to widen the executor service's own ports list.
  executor-cdp:
    image: alpine/socat:latest
    container_name: automation_executor_cdp
    profiles: ["debug"]
    command:
      - "TCP-LISTEN:${EXECUTOR_CDP_PORT:-9222},fork,reuseaddr"
      - "TCP:executor:${EXECUTOR_CDP_PORT:-9222}"
    ports:
      - "127.0.0.1:${EXECUTOR_CDP_PORT:-9222}:${EXECUTOR_CDP_PORT:-9222}"
    depends_on:
      executor:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: automation_ui
    restart: unless-stopped
    ports:
      # ADR 0007 — loopback-only by default.
      - "127.0.0.1:${UI_PORT:-3000}:${UI_PORT:-3000}"
    environment:
      UI_PORT: ${UI_PORT:-3000}
      API_BASE_URL: ""
      API_PROXY_PASS: http://api:${API_PORT:-8000}
    depends_on:
      - api

  postgres_test:
    image: postgres:16-alpine
    container_name: automation_db_test
    restart: unless-stopped
    command: [ "postgres", "-p", "${POSTGRES_TEST_DOCKER_PORT:-5432}" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-test_db}
    ports:
      # ADR 0007 — loopback-only by default.
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5434}:${POSTGRES_TEST_DOCKER_PORT:-5432}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p ${POSTGRES_TEST_DOCKER_PORT:-5432}" ]
      interval: ${POSTGRES_TEST_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${POSTGRES_TEST_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_TEST_HEALTHCHECK_RETRIES:-5}

volumes:
  postgres_data:
