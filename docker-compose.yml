services:
  postgres:
    image: postgres:16-alpine
    container_name: automation_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: routers/Dockerfile
    container_name: automation_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    container_name: automation_executor
    restart: unless-stopped
    ports:
      - "${EXECUTOR_VNC_PORT:-6080}:6080"
    volumes:
      - ./extensions:/extensions-input:ro
      - ./output:/results
    cap_add:
      - NET_RAW
      - SYS_PTRACE
    mem_limit: 2g
    cpus: 2.0

  postgres_test:
    image: postgres:16-alpine
    container_name: automation_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: test_db
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
