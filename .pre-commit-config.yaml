# Pre-commit hooks configuration
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  # ============================================================
  # GENERAL HOOKS
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^executor/playwright/workspace\.py$  # Intentional fake keys for honeypot
      - id: check-case-conflict

  # ============================================================
  # RUFF - Linting & Formatting
  # ============================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.3
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: ^extensions/
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^extensions/

  # ============================================================
  # MYPY - Type Checking
  # ============================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
          - pydantic-settings>=2.0.0
          - sqlalchemy>=2.0.0
          - fastapi>=0.100.0
        args: [--config-file=pyproject.toml]
        exclude: ^(extensions/|alembic/versions/|config/)


  # ============================================================
  # SECURITY
  # ============================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|extensions/)

  # ============================================================
  # DOCKERFILE LINTING (Requires Docker - optional)
  # ============================================================
  # Uncomment if you have Docker installed:
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.13.1-beta
  #   hooks:
  #     - id: hadolint-docker
  #       name: Lint Dockerfiles
  #       entry: hadolint
  #       language: docker_image
  #       types: [dockerfile]

# CI parallel execution settings
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
