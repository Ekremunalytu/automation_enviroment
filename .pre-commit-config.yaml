# Pre-commit hooks configuration
# Install: pre-commit install
# Run all: pre-commit run --all-files
#
# Python version note (W17-7d, 2026-05-18):
# The hooks below run on ``python3.12`` (default_language_version), which
# is intentionally NEWER than the project's stated runtime floors:
#
#   - ``executor/container/Dockerfile`` ships Ubuntu 22.04 + python3.10
#     (gated by ``tests/architecture/test_executor_container_python_compat.py``
#     — forbids 3.11+ APIs in executor-shipped files).
#   - ``docker/api/Dockerfile`` ships ``python:3.11-slim-bookworm``.
#   - ``pyproject.toml`` declares ``requires-python = ">=3.11"`` plus ruff
#     ``target-version = "py311"`` and mypy ``python_version = "3.11"``.
#
# The hooks (ruff, mypy, bandit) read their own ``target-version`` /
# ``python_version`` knobs from ``pyproject.toml`` to decide which language
# level to lint against — so the interpreter pre-commit uses to RUN the
# hooks does not affect lint output. We pin 3.12 here because every active
# developer environment has 3.12 available locally; pinning 3.11 would
# require devs to install a second interpreter for no behavioural gain.

default_language_version:
  python: python3.12

# Install all declared stages on a plain ``pre-commit install`` so the
# pre-push gate (``make check-all``) cannot silently go unwired. ``make
# install-hooks`` installs the same set explicitly.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # ============================================================
  # GENERAL HOOKS
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.snap$  # Vitest snapshots preserve JSX text-node trailing whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        # JSONC permits comments/trailing commas; the corpus path is the
        # deliberate malformed-manifest coverage control.
        exclude: ^(ui/tsconfig.*\.json|tests/static_corpus/samples/tuning-manifest-malformed/package\.json)$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: |
          (?x)^(
            executor/playwright/workspace\.py|
            executor/flows/playwright/report_builder\.py|
            tests/platform/security/test_content_sample_redaction\.py|
            tests/platform/security/test_extension_host_output_redaction\.py|
            tests/platform/contracts/test_secret_detection\.py|
            documents/POST_POC_BACKLOG\.md|
            documents/REFACTOR_STATUS\.md|
            documents/active-work/W11-monitor-lifecycle\.md|
            documents/active-work/W13-test-expansion-observability\.md|
            documents/archive/backlog/.*\.md|
            documents/archive/status/.*\.md
          )$  # Intentional fake-key markers: honeypot + redaction tests + PEM-marker substring detector + W11-companion landing notes + W13-7 PEM ReDoS scope-lock docs; archive/{backlog,status}/*.md inherits exclusion (frozen snapshots of excluded working docs)
      - id: check-case-conflict

  # ============================================================
  # RUFF - Linting & Formatting
  # ============================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: ^extensions/
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^extensions/

  # ============================================================
  # MYPY - Type Checking
  # ============================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        language_version: python3.12
        additional_dependencies:
          - fastapi==0.135.1
          - pydantic==2.12.5
          - pydantic-settings==2.13.1
          - sqlalchemy==2.0.48
        args: [--config-file=pyproject.toml, --cache-dir=.mypy_cache/pre-commit]
        exclude: ^(extensions/|alembic/versions/|config/|ui/)


  # ============================================================
  # SECURITY
  # ============================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|extensions/)

  # ============================================================
  # DOCKERFILE LINTING (Requires Docker - optional)
  # ============================================================
  # Uncomment if you have Docker installed:
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.13.1-beta
  #   hooks:
  #     - id: hadolint-docker
  #       name: Lint Dockerfiles
  #       entry: hadolint
  #       language: docker_image
  #       types: [dockerfile]

  # ============================================================
  # DOCUMENTATION
  # ============================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        # W14 close-out: dropped --fix so the hook fails loud rather than
        # mangling docs in-place (ADR 0009 lost its code-fence language
        # info because prior --fix runs re-emitted bare fences; the
        # `make markdownlint` target mirrors this gate for CI/local use).
        args: ["--config", ".markdownlint.json"]
        exclude: ^(extensions/|alembic/README|documents/archive/)

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.12.2
    hooks:
      - id: markdown-link-check
        args: ["--quiet", "--config", ".mlc_config.json"]
        exclude: ^(extensions/|documents/archive/)

  # ============================================================
  # PRE-PUSH — Full local check gate (replaces remote CI)
  # Activate once with: pre-commit install --hook-type pre-push
  # ============================================================
  - repo: local
    hooks:
      - id: make-check-all
        name: make check-all
        entry: make check-all
        language: system
        pass_filenames: false
        stages: [pre-push]

# pre-commit.ci settings (autofix bot — no GitHub Actions involved)
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
