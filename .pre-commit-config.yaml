# Pre-commit hooks configuration
# Install: pre-commit install
# Run all: pre-commit run --all-files

default_language_version:
  python: python3.12

repos:
  # ============================================================
  # GENERAL HOOKS
  # ============================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.snap$  # Vitest snapshots preserve JSX text-node trailing whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^executor/playwright/workspace\.py$  # Intentional fake keys for honeypot
      - id: check-case-conflict

  # ============================================================
  # RUFF - Linting & Formatting
  # ============================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.3
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: ^extensions/
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^extensions/

  # ============================================================
  # MYPY - Type Checking
  # ============================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        language_version: python3.12
        additional_dependencies:
          - fastapi==0.135.1
          - pydantic==2.12.5
          - pydantic-settings==2.13.1
          - sqlalchemy==2.0.48
        args: [--config-file=pyproject.toml, --cache-dir=.mypy_cache/pre-commit]
        exclude: ^(extensions/|alembic/versions/|config/|ui/)


  # ============================================================
  # SECURITY
  # ============================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|extensions/)

  # ============================================================
  # DOCKERFILE LINTING (Requires Docker - optional)
  # ============================================================
  # Uncomment if you have Docker installed:
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.13.1-beta
  #   hooks:
  #     - id: hadolint-docker
  #       name: Lint Dockerfiles
  #       entry: hadolint
  #       language: docker_image
  #       types: [dockerfile]

  # ============================================================
  # DOCUMENTATION
  # ============================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json", "--fix"]
        exclude: ^(extensions/|alembic/README)

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.12.2
    hooks:
      - id: markdown-link-check
        args: ["--quiet", "--config", ".mlc_config.json"]
        exclude: ^(extensions/|documents/archive/)

# CI parallel execution settings
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
