[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extrace"
version = "1.0.0"
description = "A Secure VS Code Extension Analysis Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ExTrace Team" }]
keywords = ["vscode", "extension", "security", "analysis"]

dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.20.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.10.0,<2.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
    "bandit>=1.8.0",
]

# Explicitly define packages to avoid auto-discovery issues
[tool.setuptools.packages.find]
include = [
    "appcore*",
    "executor*",
    "workflows*",
]
exclude = ["tests*", "extensions*", "alembic*", "output*", "reporter*", "documents*", "config*", "ui*"]

# ============================================================
# RUFF CONFIGURATION
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
    "extensions",
    ".mypy_cache",
    ".ruff_cache",
    "config",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "T20",    # flake8-print
    "RUF",    # Ruff-specific rules
]
ignore = [
    "S101",   # allow use of assert (for tests)
    "B008",   # function call in FastAPI Depends
    "N815",   # for VS Code API camelCase fields (displayName, galleryBanner)
    "S104",   # 0.0.0.0 binding required for Docker container access
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "T20", "E501", "I001", "SIM117"]
"tests/**/*.py" = ["S101", "T20", "E501", "I001", "SIM117"]
"alembic/*" = ["T20"]
"executor/*.py" = ["T20", "S603", "S607", "E501"]  # Subprocess calls intentional, long strings for fake creds
"executor/**/*.py" = ["T20", "S603", "S607", "E501"]
"ui/*.py" = ["E501"]  # HTML/CSS inline strings are naturally long
"ui/**/*.py" = ["E501"]
"appcore/api/config.py" = ["S105"]  # Development default passwords in settings

[tool.ruff.lint.isort]
known-first-party = [
    "appcore",
    "workflows",
    "executor",
]

# ============================================================
# MYPY CONFIGURATION
# ============================================================
[tool.mypy]
python_version = "3.11"
# Strict mode disabled - too strict for project
strict = false
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
ignore_missing_imports = true
plugins = []
exclude = [
    "^extensions/",
    "^alembic/",
    "^\\.venv/",
    "^extrace\\.egg-info/",
    "^config/",
    "^ui/",
]

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "alembic.*",
    "uvicorn.*",
    "pytest.*",
    "httpx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*",
    "alembic.env",
    "scripts.*",
]
ignore_errors = true

# ============================================================
# PYTEST CONFIGURATION
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not smoke",
    "-ra",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "smoke: marks end-to-end smoke acceptance tests",
]
asyncio_mode = "auto"

# ============================================================
# COVERAGE CONFIGURATION
# ============================================================
[tool.coverage.run]
source = [
    "appcore",
    "workflows",
    "executor",
]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
fail_under = 0

# ============================================================
# BANDIT CONFIGURATION
# ============================================================
[tool.bandit]
exclude_dirs = ["tests", "alembic", "extensions", ".venv", "extrace.egg-info", "executor"]
skips = ["B101"]
